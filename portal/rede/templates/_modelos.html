{# Escolha do modelo com um desenho de cada aparelho (conferido com fotos reais em 12/11/2026: ambos tem 4 teclas de funcao
   abaixo do visor; so o GRP2602W tem 2 teclas de linha a esquerda do visor; nada e laranja). #}
<fieldset class="mb-3 modelos">
  <legend class="form-label fs-6 mb-2">Qual é o seu telefone? <span class="fw-normal text-muted">O nome está na caixa e na etiqueta de baixo.</span></legend>
  <div class="row g-2">
    <div class="col-6">
      <input class="form-check-input visually-hidden" type="radio" name="modelo" id="modelo-grp" value="grp" checked>
      <label class="modelo-card" for="modelo-grp">
        <svg viewBox="0 0 200 150" role="img" aria-label="GRP2601: visor com quatro teclas abaixo e nenhuma ao lado, liga por cabo de rede" class="w-100">
          <rect x="18" y="22" width="164" height="110" rx="12" fill="#2b2f36"/>
          <rect x="60" y="34" width="88" height="44" rx="3" fill="#cfe3d6"/>
          <g fill="#aab"><rect x="62" y="84" width="18" height="7" rx="2"/><rect x="84" y="84" width="18" height="7" rx="2"/><rect x="106" y="84" width="18" height="7" rx="2"/><rect x="128" y="84" width="18" height="7" rx="2"/></g>
          <g fill="#aab"><rect x="40" y="100" width="14" height="9" rx="2"/><rect x="60" y="100" width="14" height="9" rx="2"/><rect x="80" y="100" width="14" height="9" rx="2"/>
            <rect x="40" y="114" width="14" height="9" rx="2"/><rect x="60" y="114" width="14" height="9" rx="2"/><rect x="80" y="114" width="14" height="9" rx="2"/></g>
          <circle cx="146" cy="110" r="11" fill="none" stroke="#aab" stroke-width="3"/>
          <g stroke="#1d5f8a" stroke-width="4" fill="none" stroke-linecap="round"><path d="M100 132v14"/><rect x="92" y="138" width="16" height="10" rx="2" fill="#1d5f8a" stroke="none"/></g>
        </svg>
        <span class="modelo-nome">GRP2601</span>
        <span class="modelo-desc">Nenhuma tecla ao lado do visor. Cabo de rede.</span>
      </label>
    </div>
    <div class="col-6">
      <input class="form-check-input visually-hidden" type="radio" name="modelo" id="modelo-grpw" value="grpw">
      <label class="modelo-card" for="modelo-grpw">
        <svg viewBox="0 0 200 150" role="img" aria-label="GRP2602W: visor com duas teclas à esquerda e quatro abaixo, usa o Wi-Fi da casa" class="w-100">
          <rect x="18" y="22" width="164" height="110" rx="12" fill="#2b2f36"/>
          <rect x="60" y="34" width="88" height="44" rx="3" fill="#cfe3d6"/>
          <g fill="#aab"><rect x="62" y="84" width="18" height="7" rx="2"/><rect x="84" y="84" width="18" height="7" rx="2"/><rect x="106" y="84" width="18" height="7" rx="2"/><rect x="128" y="84" width="18" height="7" rx="2"/></g>
          <g fill="#aab"><rect x="40" y="100" width="14" height="9" rx="2"/><rect x="60" y="100" width="14" height="9" rx="2"/><rect x="80" y="100" width="14" height="9" rx="2"/>
            <rect x="40" y="114" width="14" height="9" rx="2"/><rect x="60" y="114" width="14" height="9" rx="2"/><rect x="80" y="114" width="14" height="9" rx="2"/></g>
          <circle cx="146" cy="110" r="11" fill="none" stroke="#aab" stroke-width="3"/>
          <g fill="#aab"><rect x="38" y="44" width="16" height="8" rx="3"/><rect x="38" y="60" width="16" height="8" rx="3"/></g>
          <g fill="none" stroke="#1d5f8a" stroke-width="4" stroke-linecap="round"><path d="M86 142a20 20 0 0 1 28 0"/><path d="M78 134a32 32 0 0 1 44 0"/></g><circle cx="100" cy="148" r="3" fill="#1d5f8a"/>
        </svg>
        <span class="modelo-nome">GRP2602W</span>
        <span class="modelo-desc">2 teclas à esquerda do visor e "W" no nome. Wi-Fi.</span>
      </label>
    </div>
  </div>
</fieldset>
