{# Escolha do modelo com um desenho de cada aparelho. O nome do modelo esta na caixa e na etiqueta de baixo. #}
<fieldset class="mb-3 modelos">
  <legend class="form-label fs-6 mb-2">Qual é o seu telefone? <span class="fw-normal text-muted">O nome está na caixa e na etiqueta de baixo.</span></legend>
  <div class="row g-2">
    <div class="col-6">
      <input class="form-check-input visually-hidden" type="radio" name="modelo" id="modelo-grp" value="grp" checked>
      <label class="modelo-card" for="modelo-grp">
        <svg viewBox="0 0 200 150" role="img" aria-label="GRP2601: visor pequeno com duas teclas à direita, liga por cabo de rede" class="w-100">
          <rect x="18" y="22" width="164" height="110" rx="12" fill="#2b2f36"/>
          <rect x="36" y="38" width="88" height="46" rx="4" fill="#cfe3d6"/>
          <rect x="132" y="40" width="30" height="10" rx="3" fill="#E8761E"/>
          <rect x="132" y="56" width="30" height="10" rx="3" fill="#E8761E"/>
          <g fill="#aab"><rect x="40" y="94" width="14" height="9" rx="2"/><rect x="60" y="94" width="14" height="9" rx="2"/><rect x="80" y="94" width="14" height="9" rx="2"/>
            <rect x="40" y="108" width="14" height="9" rx="2"/><rect x="60" y="108" width="14" height="9" rx="2"/><rect x="80" y="108" width="14" height="9" rx="2"/></g>
          <circle cx="146" cy="104" r="12" fill="none" stroke="#aab" stroke-width="3"/>
          <g stroke="#1D4F91" stroke-width="4" fill="none" stroke-linecap="round"><path d="M100 132v14"/><rect x="92" y="138" width="16" height="10" rx="2" fill="#1D4F91" stroke="none"/></g>
        </svg>
        <span class="modelo-nome">GRP2601</span>
        <span class="modelo-desc">2 teclas ao lado do visor. Cabo de rede.</span>
      </label>
    </div>
    <div class="col-6">
      <input class="form-check-input visually-hidden" type="radio" name="modelo" id="modelo-grpw" value="grpw">
      <label class="modelo-card" for="modelo-grpw">
        <svg viewBox="0 0 200 150" role="img" aria-label="GRP2602W: visor pequeno com quatro teclas à direita, usa o Wi-Fi da casa" class="w-100">
          <rect x="18" y="22" width="164" height="110" rx="12" fill="#2b2f36"/>
          <rect x="36" y="38" width="88" height="46" rx="4" fill="#cfe3d6"/>
          <g fill="#E8761E"><rect x="132" y="38" width="30" height="8" rx="3"/><rect x="132" y="50" width="30" height="8" rx="3"/><rect x="132" y="62" width="30" height="8" rx="3"/><rect x="132" y="74" width="30" height="8" rx="3"/></g>
          <g fill="#aab"><rect x="40" y="94" width="14" height="9" rx="2"/><rect x="60" y="94" width="14" height="9" rx="2"/><rect x="80" y="94" width="14" height="9" rx="2"/>
            <rect x="40" y="108" width="14" height="9" rx="2"/><rect x="60" y="108" width="14" height="9" rx="2"/><rect x="80" y="108" width="14" height="9" rx="2"/></g>
          <circle cx="146" cy="104" r="12" fill="none" stroke="#aab" stroke-width="3"/>
          <g fill="none" stroke="#1D4F91" stroke-width="4" stroke-linecap="round"><path d="M86 142a20 20 0 0 1 28 0"/><path d="M78 134a32 32 0 0 1 44 0"/></g><circle cx="100" cy="148" r="3" fill="#1D4F91"/>
        </svg>
        <span class="modelo-nome">GRP2602W</span>
        <span class="modelo-desc">4 teclas ao lado do visor e "W" no nome. Wi-Fi.</span>
      </label>
    </div>
  </div>
</fieldset>
