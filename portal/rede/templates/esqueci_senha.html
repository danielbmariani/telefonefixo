{% extends "base.html" %}
{% block title %}Esqueci a senha | {{ nome_rede }}{% endblock %}
{% block content %}
<div class="auth-card"><h1 class="h2 mb-1">Esqueci a senha</h1>
<p class="text-muted mb-4">Enviamos um link para você criar outra.</p>
<div class="card"><div class="card-body">
<form method="post"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control form-control-lg" type="email" id="email" name="email" required autocomplete="email"></div>
  <button class="btn btn-primary btn-lg w-100">Enviar link</button></form>
</div></div>
<p class="mt-3 text-center"><a href="{{ url_for('auth.entrar') }}">Voltar</a></p></div>
{% endblock %}
