{% extends "base.html" %}
{% block title %}Entrar | {{ nome_rede }}{% endblock %}
{% block content %}
<div class="auth-card">
  <h1 class="h2 mb-1">Entrar</h1>
  <p class="text-muted mb-4">Conta do responsável.</p>
  <div class="card"><div class="card-body">
    <form method="post">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
      <div class="mb-3"><label class="form-label" for="email">E-mail</label><input class="form-control form-control-lg" type="email" id="email" name="email" required autofocus autocomplete="email"></div>
      <div class="mb-3"><label class="form-label" for="senha">Senha</label><input class="form-control form-control-lg" type="password" id="senha" name="senha" required autocomplete="current-password"></div>
      <button class="btn btn-primary btn-lg w-100" type="submit">Entrar</button>
    </form>
    <div class="text-center mt-3"><a class="small" href="{{ url_for('auth.esqueci_senha') }}">Esqueceu a senha?</a></div>
  </div></div>
  <p class="text-center mt-3">Primeira vez? <a href="{{ url_for('auth.cadastrar') }}">Criar a conta da família</a></p>
</div>
{% endblock %}
