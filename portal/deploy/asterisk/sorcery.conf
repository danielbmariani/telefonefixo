; sorcery.conf — diz ao res_pjsip de onde vem cada tipo de objeto
; Transportes continuam no pjsip.conf (estatico). O resto vem do banco.
; Ordem: primeiro o pjsip.conf (tronco da operadora, estatico), depois o banco (ramais das criancas).
[res_pjsip]
endpoint=config,pjsip.conf,criteria=type=endpoint
endpoint=realtime,ps_endpoints
auth=config,pjsip.conf,criteria=type=auth
auth=realtime,ps_auths
aor=config,pjsip.conf,criteria=type=aor
aor=realtime,ps_aors
contact=realtime,ps_contacts
; Cache desligado no inicio (rede pequena). Para ligar depois:
; endpoint/cache=memory_cache,maximum_objects=1000,object_lifetime_maximum=300
; e o portal passa a chamar o flush de cache ao alterar um ramal.

[res_pjsip_endpoint_identifier_ip]
identify=config,pjsip.conf,criteria=type=identify
identify=realtime,ps_endpoint_id_ips
