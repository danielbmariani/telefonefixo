; ari.conf — ARI (Asterisk REST Interface) so para o servico rede-grupo, em localhost.
; A senha e trocada pelo deploy/grupos.sh (mesma de REDE_ARI_SENHA em /etc/rede-aberta/portal.env).
[general]
enabled = yes
pretty = no
allowed_origins = 

[rede]
type = user
read_only = no
password = TROCAR_SENHA
password_format = plain
