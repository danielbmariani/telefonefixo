; =============================================================================
; extensions.conf — Rede Aberta (IDs de 6 digitos)
; Derivado de telefone_fixo/web/deploy/extensions.conf.new. Mesma logica;
; mudam os padroes e a mensagem "nao esta na lista de amigos".
;   1XX          servicos (100 = hora certa)
;   [2-7]XXXXX   ID de crianca
;   0[1-9]       grupo para ligar juntos: Stasis(grupo) -> servico rede-grupo pelo ARI (doc 16)
;   9[2-7]XXXXX  celular 1 da familia pelo tronco da operadora (B23); 8[2-7]XXXXX celular 2
;   8 a 13 dig.  telefone da lista da familia (doc 20): numero local, DDD + numero, com 0 ou 55 na frente
;   [tronco-entrada] ligacao vinda do tronco: so celular cadastrado faz tocar a crianca
; =============================================================================
[general]
static = yes
writeprotect = no

[globals]
; Canais contratados na Vono (bancada B30). 0 desliga a Vono e tudo sai pela Nvoip.
VONO_CANAIS=4
; Endpoint PJSIP da Vono. Para testar a queda para a Nvoip sem mexer na Vono: "dialplan set global VONO_ENDPOINT vono-x".
VONO_ENDPOINT=vono

[set-jitterbuffer]
exten => s,1,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Set(VOLUME(TX)=3)
 same => n,Set(VOLUME(RX)=3)
 same => n,Return()

; Perna do tronco nas ligacoes da crianca para o celular: so o volume, sem JITTERBUFFER (bancada B28).
[set-volume-tronco]
exten => s,1,Set(VOLUME(TX)=3)
 same => n,Set(VOLUME(RX)=3)
 same => n,Return()

[telefones-criancas]
exten => 100,1,Answer()
 same => n,Set(VOLUME(TX)=3)
 same => n,Wait(1)
 same => n,AGI(hora_certa.py)
 same => n,Hangup()

; --- Saida pelo tronco da operadora: celulares de casa e telefones da lista da familia ---
; 9+ID: celular 1; 8+ID: celular 2 (pagina Celulares do site). Telefones da lista (doc 20): a crianca disca so o
; numero (8 digitos fixo, 9 celular) quando e do DDD da casa, ou DDD + numero (10 ou 11); 0 e 55 na frente sao
; tolerados. check_call.py decide (lista da familia, horario, teto) e devolve o Dial em FAMILIA_DIAL. Tudo passa
; pela sub-rotina [saida-tronco]: Vono enquanto houver canal, Nvoip de reserva, registro em call_logs.
exten => _[89][2-7]XXXXX,1,NoOp(Celular da familia: ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _[2-5]XXXXXXX,1,NoOp(Telefone da lista (fixo local): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _9XXXXXXXX,1,NoOp(Telefone da lista (celular local): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _[1-9][1-9][2-5]XXXXXXX,1,NoOp(Telefone da lista (DDD + fixo): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _[1-9][1-9]9XXXXXXXX,1,NoOp(Telefone da lista (DDD + celular): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _0[1-9][1-9][2-5]XXXXXXX,1,NoOp(Telefone da lista (0 + DDD + fixo): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _0[1-9][1-9]9XXXXXXXX,1,NoOp(Telefone da lista (0 + DDD + celular): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _55[1-9][1-9][2-5]XXXXXXX,1,NoOp(Telefone da lista (55 + DDD + fixo): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()
exten => _55[1-9][1-9]9XXXXXXXX,1,NoOp(Telefone da lista (55 + DDD + celular): ${CALLERID(num)} -> ${EXTEN})
 same => n,Gosub(saida-tronco,s,1(${EXTEN}))
 same => n,Hangup()

; --- Grupo para ligar juntos (doc 16): 0 + codigo do cartao da propria crianca ---
; O servico rede-grupo (ARI, app "grupo") decide, anuncia, toca em todos e registra. Se o servico
; estiver fora do ar, Stasis volta na hora e a crianca ouve "nao deu certo".
exten => _0[1-9],1,NoOp(Grupo: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Stasis(grupo,chamador,${EXTEN:1})
 same => n,Answer()
 same => n,Playback(rede/frases/nao-deu-certo)
 same => n,Hangup()

; --- Chamada para crianca ---
exten => _[2-7]XXXXX,1,NoOp(Chamada de ${CALLERID(num)} para ${EXTEN})
 same => n,AGI(check_call.py)
 same => n,GotoIf($["${CALL_RESULT}" = "ALLOW"]?permitido)
 same => n,Gosub(bloqueio,s,1)
 same => n,Hangup()
 same => n(permitido),Set(CALL_DEST=${EXTEN})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Dial(PJSIP/${EXTEN},60,rtTb(set-jitterbuffer^s^1))
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n,Set(CALL_DEST=)
 same => n,Gosub(pos-dial,s,1)
 same => n,Hangup()

exten => h,1,GotoIf($["${CALL_DEST}" = ""]?fim)
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n(fim),NoOp(Hangup handler finalizado)

exten => _X.,1,NoOp(Numero bloqueado: ${EXTEN})
 same => n,Answer()
 same => n,Playback(telefone/numero-invalido)
 same => n,Hangup()
exten => i,1,Answer()
 same => n,Playback(telefone/numero-invalido)
 same => n,Hangup()

; Sub-rotina de saida pelo tronco. ARG1 = o que a crianca discou. Limite de 30 min por ligacao (L).
[saida-tronco]
exten => s,1,AGI(check_call.py,${ARG1})
 same => n,GotoIf($["${CALL_RESULT}" = "ALLOW"]?permitido)
 same => n,Gosub(bloqueio,s,1)
 same => n,Return()
 ; CALL_DEST: para 9/8+ID fica o discado (custos.py conta por '9'+ID); para telefone da lista, o numero normalizado
 same => n(permitido),Set(CALL_DEST=${IF($["${FAMILIA_DEST}" != ""]?${FAMILIA_DEST}:${ARG1})})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(JITTERBUFFER(adaptive)=200,1000,40)
 ; Tronco de saida (bancada B30): Vono (canais ilimitados) enquanto houver canal livre na rede inteira;
 ; sem canal, ou se a Vono recusar na hora, a ligacao sai pela Nvoip (por minuto). VONO_CANAIS em [globals].
 same => n,Set(FAMILIA_NUM=${CUT(CUT(FAMILIA_DIAL,@,1),/,2)})
 ; FAMILIA_VONO vem do check_call.py: 0 quando a rede ja usou os minutos do mes na Vono (custos.vono_disponivel).
 same => n,GotoIf($[${VONO_CANAIS} > 0 & ${GROUP_COUNT(vono)} < ${VONO_CANAIS} & "${FAMILIA_VONO}" != "0"]?vono:nvoip)
 same => n(vono),Set(GROUP()=vono)
 same => n,Set(CALL_TRONCO=vono)
 ; A Vono exige 0 + DDD + numero (sem o 0 responde 410 Gone); a Nvoip aceita DDD + numero.
 same => n,Dial(PJSIP/0${FAMILIA_NUM}@${VONO_ENDPOINT},45,rL(${FAMILIA_LIMITE_MS}:30000)b(set-volume-tronco^s^1))
 same => n,GotoIf($["${DIALSTATUS}" = "CHANUNAVAIL" | "${DIALSTATUS}" = "CONGESTION"]?nvoip:gravar)
 same => n(nvoip),Set(GROUP()=nvoip)
 same => n,Set(CALL_TRONCO=nvoip)
 same => n,Dial(${FAMILIA_DIAL},45,rL(${FAMILIA_LIMITE_MS}:30000)b(set-volume-tronco^s^1))
 same => n(gravar),Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n,Set(CALL_DEST=)
 same => n,Gosub(pos-dial,s,1)
 same => n,Return()
; Se a crianca desliga durante o Dial, o h roda no contexto em que o canal esta (este), nao no de origem.
exten => h,1,GotoIf($["${CALL_DEST}" = ""]?fim)
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n(fim),NoOp(Saida pelo tronco encerrada)

; Mensagens de bloqueio por tipo (subrotina)
[bloqueio]
exten => s,1,Answer()
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_SCHEDULE_CALLER"]?hc)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_SCHEDULE_DEST"]?hd)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_PERMISSION"]?perm)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_UNKNOWN"]?inv)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_PARENT"]?semcel)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_TETO"]?teto)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_EXTERNO"]?ext)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_AMBIGUO"]?amb)
 same => n,Playback(telefone/sem-permissao)
 same => n,Return()
 same => n(ext),Playback(rede/frases/nao-esta-na-lista-de-casa)   ; "Esse telefone nao esta na lista de casa" (voz.py, doc 20)
 same => n,Return()
 same => n(amb),Playback(rede/frases/disque-com-ddd)   ; "Esse numero existe em dois DDDs na sua lista. Disque com o DDD."
 same => n,Return()
 same => n(semcel),Playback(telefone/sem-celular)   ; "O celular da familia ainda nao foi cadastrado no site"
 same => n,Return()
 same => n(teto),Playback(telefone/sem-minutos)   ; "Os minutos para celular deste mes acabaram"
 same => n,Return()
 same => n(hc),Playback(telefone/horario-caller)
 same => n,Return()
 same => n(hd),Playback(telefone/horario-destino)
 same => n,Return()
 same => n(perm),Playback(telefone/nao-esta-na-lista)   ; novo som: "esse numero nao esta na sua lista de amigos"
 same => n,Return()
 same => n(inv),Playback(telefone/numero-invalido)
 same => n,Return()

[pos-dial]
exten => s,1,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?semresposta)
 same => n,Return()
 same => n(ocupado),Answer()
 same => n,Playback(telefone/ocupado)
 same => n,Return()
 same => n(semresposta),Answer()
 same => n,Playback(telefone/sem-resposta)
 same => n,Return()

; =============================================================================
; Entrada pelos troncos das operadoras (endpoints "nvoip" e "vono", ver deploy/tronco.sh e tronco-vono.sh).
; check_entrada.py: identificador do chamador -> familia -> criancas com telefone conectado e dentro
; do horario. Numero desconhecido ouve "numero invalido" e cai. Nao ha caixa postal. O unico menu e o de
; desempate quando o mesmo numero esta em mais de uma familia (doc 20).
; =============================================================================
[tronco-entrada]
exten => s,1,Goto(entrada,1)
exten => _X.,1,Goto(entrada,1)
exten => _+X.,1,Goto(entrada,1)
; A Vono entrega a ligacao com o nosso usuario do tronco no destino (ex.: "ldem..."), nao com o numero (B30).
exten => _[a-zA-Z].,1,Goto(entrada,1)
exten => entrada,1,NoOp(Entrada pelo tronco ${CHANNEL(endpoint)}: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(GROUP()=${CHANNEL(endpoint)})
 same => n,Set(CALL_TRONCO=${CHANNEL(endpoint)})
 same => n,AGI(check_entrada.py,${CALLERID(name)},${PJSIP_HEADER(read,P-Asserted-Identity)},${PJSIP_HEADER(read,Remote-Party-ID)})
 same => n,GotoIf($["${ENTRADA_RESULT}" = "ALLOW"]?toca)
 same => n,GotoIf($["${ENTRADA_RESULT}" = "MENU"]?menu)
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf($["${ENTRADA_RESULT}" = "BLOCK_TETO"]?teto)
 same => n,Playback(telefone/numero-invalido)
 same => n,Hangup()
 same => n(teto),Playback(telefone/sem-minutos)
 same => n,Hangup()
 ; O mesmo numero esta em mais de uma familia (doc 20, 3.3): "Para falar com <apelido>, tecle 1. Para falar com
 ; <apelido>, tecle 2." Read() toca as frases e espera um digito (duas tentativas). ENTRADA_OPCOES = IDs separados
 ; por virgula, ENTRADA_NOMES = nomes dados ao numero por cada familia (separados por ~), ENTRADA_LIMITES = teto em ms.
 same => n(menu),Answer()
 same => n,Wait(1)
 same => n,Set(MENU_N=${FIELDQTY(ENTRADA_OPCOES,\,)})
 same => n,Set(MENU_I=1)
 same => n,Set(MENU_ARQS=)
 same => n(menu-loop),GotoIf($[${MENU_I} > ${MENU_N}]?menu-ler)
 same => n,Set(MENU_ARQS=${MENU_ARQS}${IF($["${MENU_ARQS}" != ""]?&)}rede/frases/para-falar-com&rede/${CUT(ENTRADA_SONS,\,,${MENU_I})}&rede/frases/tecle-${MENU_I})
 same => n,Set(MENU_I=$[${MENU_I}+1])
 same => n,Goto(menu-loop)
 same => n(menu-ler),Read(MENU_ESCOLHA,${MENU_ARQS},1,,2,6)
 same => n,GotoIf($[${REGEX("^[1-9]$" ${MENU_ESCOLHA})} = 0]?menu-nada)
 same => n,GotoIf($[${MENU_ESCOLHA} > ${MENU_N}]?menu-nada)
 same => n,Set(ENTRADA_DEST=${CUT(ENTRADA_OPCOES,\,,${MENU_ESCOLHA})})
 same => n,Set(ENTRADA_DIAL=PJSIP/${ENTRADA_DEST})
 same => n,Set(ENTRADA_NOME=${CUT(ENTRADA_NOMES,~,${MENU_ESCOLHA})})
 same => n,Set(ENTRADA_LIMITE_MS=${CUT(ENTRADA_LIMITES,\,,${MENU_ESCOLHA})})
 same => n,Goto(toca)
 same => n(menu-nada),Playback(rede/frases/nao-deu-certo)
 same => n,Hangup()
 same => n(toca),Set(CALLERID(num)=${ENTRADA_NUMERO})
 same => n,Set(CALLERID(name)=${ENTRADA_NOME})
 same => n,Set(CALL_DEST=${ENTRADA_DEST})
 same => n,Set(CALL_START=${EPOCH})
 ; Sem JITTERBUFFER no canal do tronco: a voz do celular nao chegava ao telefone (bancada B28, parte 2).
 same => n,Dial(${ENTRADA_DIAL},40,rL(${ENTRADA_LIMITE_MS}:30000)b(set-jitterbuffer^s^1))
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n,Set(CALL_DEST=)
 same => n,Hangup()
exten => h,1,GotoIf($["${CALL_DEST}" = ""]?fim)
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n(fim),NoOp(Entrada encerrada)
