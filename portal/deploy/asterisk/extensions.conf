; =============================================================================
; extensions.conf — Rede Aberta (IDs de 6 digitos)
; Derivado de telefone_fixo/web/deploy/extensions.conf.new. Mesma logica;
; mudam os padroes e a mensagem "nao esta na lista de amigos".
;   1XX          servicos (100 = hora certa)
;   [2-7]XXXXX   ID de crianca
;   0[1-9]       grupo para ligar juntos: Stasis(grupo) -> servico rede-grupo pelo ARI (doc 16)
;   9[2-7]XXXXX  celular 1 da familia pelo tronco da operadora (B23); 8[2-7]XXXXX celular 2
;   [tronco-entrada] ligacao vinda do tronco: so celular cadastrado faz tocar a crianca
; =============================================================================
[general]
static = yes
writeprotect = no

[set-jitterbuffer]
exten => s,1,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Set(VOLUME(TX)=3)
 same => n,Set(VOLUME(RX)=3)
 same => n,Return()

[telefones-criancas]
exten => 100,1,Answer()
 same => n,Set(VOLUME(TX)=3)
 same => n,Wait(1)
 same => n,AGI(hora_certa.py)
 same => n,Hangup()

; --- Celular da familia (9+ID: celular 1; 8+ID: celular 2, conforme a pagina Celulares do site) ---
; check_call.py decide (so o proprio ID, horario da crianca, celular cadastrado naquela posicao) e devolve
; em FAMILIA_DIAL a string "PJSIP/11999990000@nvoip". Limite de 30 min por ligacao (L).
exten => _[89][2-7]XXXXX,1,NoOp(Celular da familia: ${CALLERID(num)} -> ${EXTEN})
 same => n,AGI(check_call.py)
 same => n,GotoIf($["${CALL_RESULT}" = "ALLOW"]?permitido)
 same => n,Gosub(bloqueio,s,1)
 same => n,Hangup()
 same => n(permitido),Set(CALL_DEST=${EXTEN})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Dial(${FAMILIA_DIAL},45,rL(${FAMILIA_LIMITE_MS}:30000)b(set-jitterbuffer^s^1))
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n,Set(CALL_DEST=)
 same => n,Gosub(pos-dial,s,1)
 same => n,Hangup()

; --- Grupo para ligar juntos (doc 16): 0 + codigo do cartao da propria crianca ---
; O servico rede-grupo (ARI, app "grupo") decide, anuncia, toca em todos e registra. Se o servico
; estiver fora do ar, Stasis volta na hora e a crianca ouve "nao deu certo".
exten => _0[1-9],1,NoOp(Grupo: ${CALLERID(num)} -> ${EXTEN})
 same => n,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Stasis(grupo,chamador,${EXTEN:1})
 same => n,Answer()
 same => n,Playback(rede/frases/nao-deu-certo)
 same => n,Hangup()

; --- Chamada para crianca ---
exten => _[2-7]XXXXX,1,NoOp(Chamada de ${CALLERID(num)} para ${EXTEN})
 same => n,AGI(check_call.py)
 same => n,GotoIf($["${CALL_RESULT}" = "ALLOW"]?permitido)
 same => n,Gosub(bloqueio,s,1)
 same => n,Hangup()
 same => n(permitido),Set(CALL_DEST=${EXTEN})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Dial(PJSIP/${EXTEN},60,rtTb(set-jitterbuffer^s^1))
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n,Set(CALL_DEST=)
 same => n,Gosub(pos-dial,s,1)
 same => n,Hangup()

exten => h,1,GotoIf($["${CALL_DEST}" = ""]?fim)
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n(fim),NoOp(Hangup handler finalizado)

exten => _X.,1,NoOp(Numero bloqueado: ${EXTEN})
 same => n,Answer()
 same => n,Playback(telefone/numero-invalido)
 same => n,Hangup()
exten => i,1,Answer()
 same => n,Playback(telefone/numero-invalido)
 same => n,Hangup()

; Mensagens de bloqueio por tipo (subrotina)
[bloqueio]
exten => s,1,Answer()
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_SCHEDULE_CALLER"]?hc)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_SCHEDULE_DEST"]?hd)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_PERMISSION"]?perm)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_UNKNOWN"]?inv)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_PARENT"]?semcel)
 same => n,GotoIf($["${CALL_RESULT}" = "BLOCK_TETO"]?teto)
 same => n,Playback(telefone/sem-permissao)
 same => n,Return()
 same => n(semcel),Playback(telefone/sem-celular)   ; "O celular da familia ainda nao foi cadastrado no site"
 same => n,Return()
 same => n(teto),Playback(telefone/sem-minutos)   ; "Os minutos para celular deste mes acabaram"
 same => n,Return()
 same => n(hc),Playback(telefone/horario-caller)
 same => n,Return()
 same => n(hd),Playback(telefone/horario-destino)
 same => n,Return()
 same => n(perm),Playback(telefone/nao-esta-na-lista)   ; novo som: "esse numero nao esta na sua lista de amigos"
 same => n,Return()
 same => n(inv),Playback(telefone/numero-invalido)
 same => n,Return()

[pos-dial]
exten => s,1,GotoIf($["${DIALSTATUS}" = "BUSY"]?ocupado)
 same => n,GotoIf($["${DIALSTATUS}" = "NOANSWER"]?semresposta)
 same => n,Return()
 same => n(ocupado),Answer()
 same => n,Playback(telefone/ocupado)
 same => n,Return()
 same => n(semresposta),Answer()
 same => n,Playback(telefone/sem-resposta)
 same => n,Return()

; =============================================================================
; Entrada pelo tronco da operadora (endpoint "nvoip", ver deploy/tronco.sh).
; check_entrada.py: identificador do chamador -> familia -> criancas com telefone conectado e dentro
; do horario. Numero desconhecido ouve "numero invalido" e cai. Nao ha menu, nao ha caixa postal.
; =============================================================================
[tronco-entrada]
exten => s,1,Goto(entrada,1)
exten => _X.,1,Goto(entrada,1)
exten => _+X.,1,Goto(entrada,1)
exten => entrada,1,NoOp(Entrada pelo tronco: ${CALLERID(num)} -> ${EXTEN})
 same => n,AGI(check_entrada.py,${CALLERID(name)},${PJSIP_HEADER(read,P-Asserted-Identity)},${PJSIP_HEADER(read,Remote-Party-ID)})
 same => n,GotoIf($["${ENTRADA_RESULT}" = "ALLOW"]?toca)
 same => n,Answer()
 same => n,Wait(1)
 same => n,GotoIf($["${ENTRADA_RESULT}" = "BLOCK_TETO"]?teto)
 same => n,Playback(telefone/numero-invalido)
 same => n,Hangup()
 same => n(teto),Playback(telefone/sem-minutos)
 same => n,Hangup()
 same => n(toca),Set(CALLERID(num)=${ENTRADA_NUMERO})
 same => n,Set(CALLERID(name)=${ENTRADA_NOME})
 same => n,Set(CALL_DEST=${ENTRADA_DEST})
 same => n,Set(CALL_START=${EPOCH})
 same => n,Set(JITTERBUFFER(adaptive)=200,1000,40)
 same => n,Dial(${ENTRADA_DIAL},40,rL(${ENTRADA_LIMITE_MS}:30000)b(set-jitterbuffer^s^1))
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n,Set(CALL_DEST=)
 same => n,Hangup()
exten => h,1,GotoIf($["${CALL_DEST}" = ""]?fim)
 same => n,Set(CALL_DURATION=$[${EPOCH}-${CALL_START}])
 same => n,AGI(log_call.py)
 same => n(fim),NoOp(Entrada encerrada)
