server {
    listen 80;
    server_name TROCAR_DOMINIO www.TROCAR_DOMINIO;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://TROCAR_DOMINIO$request_uri; }
}
server {
    listen 443 ssl http2;
    server_name www.TROCAR_DOMINIO;
    ssl_certificate /etc/letsencrypt/live/TROCAR_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TROCAR_DOMINIO/privkey.pem;
    return 301 https://TROCAR_DOMINIO$request_uri;
}
server {
    listen 443 ssl http2;
    server_name TROCAR_DOMINIO;
    ssl_certificate /etc/letsencrypt/live/TROCAR_DOMINIO/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/TROCAR_DOMINIO/privkey.pem;
    include snippets/rede-headers.conf;
    include snippets/rede-locations.conf;
}
