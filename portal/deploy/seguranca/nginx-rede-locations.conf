# /etc/nginx/snippets/rede-locations.conf — incluido dentro do server 443 de cada dominio
client_max_body_size 1m;
location ~ ^/(entrar|cadastrar|esqueci-senha|verificar-email|reenviar-codigo)$ {
    limit_req zone=rede_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ~ ^/resetar-senha/ {
    limit_req zone=rede_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /p/ {
    limit_req zone=rede_prov burst=20 nodelay;
    access_log /var/log/nginx/rede-prov.log rede_prov;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location /gdms/ {
    access_log off;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location / {
    limit_req zone=rede_geral burst=100 nodelay;
    proxy_pass http://127.0.0.1:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}
