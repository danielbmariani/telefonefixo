# /etc/nginx/conf.d/rede-seguranca.conf — limites de taxa e versao oculta (deploy/endurecer.sh)
server_tokens off;
# login, cadastro, reset: 10 por minuto por IP (rajada de 10); provisionamento: 30 por minuto por IP
limit_req_zone $binary_remote_addr zone=rede_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=rede_prov:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=rede_geral:10m rate=300r/m;
limit_req_status 429;
# Registro do provisionamento sem a URL (o token do telefone e segredo); o MAC e o resultado ficam em prov_log no banco
log_format rede_prov '$remote_addr [$time_local] $status "$http_user_agent" $body_bytes_sent';
